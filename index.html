<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#252a31">
  <meta name="description" content="Jornadas, avances por PK, fotos y controles de terreno — Clikium.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <title>Clikium · Terreno</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="apple-touch-icon" href="/logo.svg">
  <link rel="stylesheet" href="/src/styles.css">
  <script type="module" src="/src/app.js"></script>
</head>
<body class="unauthenticated">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Clikium Terreno, inicio">
      <img src="/src/logo/Logo%20con%20fondo%20CT.svg" alt="Clikium Terreno" class="brand-logo-img">
    </a>
    <div class="project-label">PROYECTO ACTIVO</div>
    <div id="project-name" class="sidebar-project">Túnel Lo Ruiz</div>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <div class="sidebar-bottom"><span class="version-tag">VERSIÓN BETA</span><span>Túnel Lo Ruiz · Faena</span></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="topbar-left">
        <img src="/src/logo/Logo%20con%20fondo%20CT.svg" alt="Clikium Terreno" class="topbar-logo-mobile">
        <div class="topbar-title">CONTROL DE OBRA<span id="header-date"></span></div>
      </div>
      <div class="topbar-actions">
        <span id="save-status" role="status">Conectando…</span>
        <div id="user-pill" class="user-pill" title="Capataz asignado" style="display:none">
          <span class="user-pill-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
          <span id="user-display-name"></span>
          <button type="button" class="user-pill-logout" data-action="logout" title="Cerrar sesión">Salir</button>
        </div>
        <button class="icon-button" data-action="backup-view" aria-label="Abrir configuración de obra" title="Configuración de obra"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
      </div>
    </header>
    <main id="main" tabindex="-1"><div class="loading">Cargando jornadas…</div></main>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
